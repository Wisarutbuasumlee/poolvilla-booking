# PoolVilla — nginx: TLS termination and reverse proxy to the Next.js container.
# Baked into the web image at build time (Dockerfile, target `web`). Editing this
# file means rebuilding and pushing that image; the server only pulls and runs.
#
# Certificates are mounted read-only from ./nginx/certs on the server (git-ignored).
# Expected filenames:  poolvilla.pem (fullchain)  +  poolvilla.key (private key)
#
# Self-signed pair for testing, covering both hostnames:
#   openssl req -x509 -newkey rsa:2048 -nodes -days 365 \
#     -keyout nginx/certs/poolvilla.key -out nginx/certs/poolvilla.pem \
#     -subj "/CN=poolvilla.local" \
#     -addext "subjectAltName=DNS:poolvilla.local,DNS:admin.poolvilla.local"

# ---------------------------------------------------------------------------
# THE ONE RULE THAT MATTERS HERE
#
# The app decides which surface to serve from the Host header (src/proxy.ts):
# admin.<domain> is rewritten to the admin route group, everything else is the
# public site. So `proxy_set_header Host $host` is load-bearing. Replacing it
# with the upstream name would make every request look like the public site and
# the back office would become unreachable.
# ---------------------------------------------------------------------------

upstream poolvilla_app {
    server app:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/poolvilla.pem;
    ssl_certificate_key /etc/nginx/certs/poolvilla.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Villa photo uploads go through a Server Action, whose own limit is 12mb.
    # This has to sit above that or nginx rejects the request before the app
    # can return a useful error.
    client_max_body_size 20m;

    # Image processing on upload is the slowest request in the app.
    proxy_read_timeout 120s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/rss+xml image/svg+xml font/woff2;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Next.js fingerprints these filenames, so they can never go stale.
    location /_next/static/ {
        proxy_pass http://poolvilla_app;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Uploaded villa photos. The app route handler sets its own cache headers
    # and can deny access, so nginx only carries the bytes.
    location /api/uploads/ {
        proxy_pass http://poolvilla_app;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
    }

    location / {
        proxy_pass http://poolvilla_app;
        proxy_http_version 1.1;

        # Host chooses the surface. Do not change this line.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Rate limiting on login, booking and upload reads this.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Streamed Server Component responses must not be buffered or the page
        # arrives all at once and the Suspense boundaries buy nothing.
        proxy_buffering off;
    }
}
