# Development infrastructure only. The app runs on the host with npm run dev.
name: poolvilla-dev

# Infrastructure only. The Next.js app runs on the host with `npm run dev`.
#
# MongoDB runs as a SINGLE-NODE REPLICA SET, not a standalone. A standalone
# mongod cannot start a transaction at all, so a design that used one would
# fail on the developer machine and pass in production. Running rs0 locally
# means both code paths are exercised the same way everywhere.
#
# Authentication is deliberately off here. Combining --auth with --replSet
# requires an internal-auth keyFile whose permissions must be 0400; a keyFile
# on a Windows bind mount comes out world-readable and mongod refuses to start.
# The port is published to localhost only, so this is a local-development
# convenience, not a production posture. docker-compose.prod.yml enables auth.

services:
  mongodb:
    image: mongo:7
    container_name: poolvilla-mongo
    restart: unless-stopped
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      # Initiates the replica set on first boot, then reports its status.
      test: >
        mongosh --quiet --eval "
          try { rs.status().ok }
          catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }
        "
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  mongo-express:
    image: mongo-express:1.0.2
    container_name: poolvilla-mongo-express
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - '127.0.0.1:${MONGO_EXPRESS_PORT:-8081}:8081'
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017/?replicaSet=rs0&directConnection=true
      ME_CONFIG_BASICAUTH: 'false'

  redis:
    image: redis:7-alpine
    container_name: poolvilla-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mongo_data:
  redis_data:
